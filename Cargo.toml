[package]
name = "cfgdrift"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Fast, CI-friendly config drift detection for JSON, YAML, TOML, and .env files."
license = "MIT"
repository = "https://github.com/vlad-ds/cfgdrift"
homepage = "https://github.com/vlad-ds/cfgdrift"
readme = "README.md"
keywords = ["config", "diff", "drift", "cli", "ci"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
dotenvy = "0.15.7"
globset = "0.4.18"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
toml = "1.1.2"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
